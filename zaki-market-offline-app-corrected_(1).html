*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none!important}.app{min-height:100vh;display:flex}.rail{width:235px;background:var(--green);color:#fff;padding:25px 16px;display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;height:100vh}.brand{display:flex;gap:11px;align-items:center;padding:0 7px 23px;border-bottom:1px solid #ffffff25}.mark{width:36px;height:36px;border-radius:8px 8px 8px 2px;background:#e5563f;display:grid;place-items:center;font-size:22px;font-weight:800}.brand b{letter-spacing:.12em;font-size:14px}.brand small{display:block;color:#c9d8cc;font-size:9px;letter-spacing:.25em;margin-top:3px}.role{background:#ffffff14;border-radius:10px;padding:11px;margin:20px 5px;font-size:12px;color:#dbe7dc}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#a8d76b;margin-right:7px}.role strong{display:block;padding:5px 0 0 14px;color:white}.nav{display:grid;gap:4px}.nav button,.bottom button{border:0;background:transparent;color:#cbd9cd;text-align:left;padding:11px 12px;border-radius:9px;display:flex;gap:10px;align-items:center;font-size:13px}.nav button:hover,.nav button.active,.bottom button:hover{background:#ffffff18;color:#fff}.nav button.active{box-shadow:inset 3px 0 #e5563f}.bottom{margin-top:auto;border-top:1px solid #ffffff25;padding-top:12px}.main{flex:1;min-width:0}.top{height:92px;padding:0 42px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fffdf8bb}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#7a887f;margin:0}.top h1{font-size:23px;letter-spacing:-.04em;margin:6px 0 0}.top-right{display:flex;align-items:center;gap:10px}.pill,.badge{font-size:11px;font-weight:700;padding:7px 10px;border:1px solid }.watch-row strong{font-size:12px}.watch-row small{font-size:11px;color:#849087;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.watch-row>b{font-size:12px}.reserve{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 20px;border:1px solid #d8e2d6;border-radius:14px;background:var(--soft)}.reserve strong{font-size:12px}.reserve div:first-child{display:flex;gap:11px;align-items:center}.reserve-icon{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#d2e6d1;color:#286246}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:22px}.toolbar h2{margin:6px 0 0;font-size:19px}.toolbar p:not(.eyebrow){color:var(--muted);font-size:12px;margin:7px 0 0}.actions{display:flex;gap:9px;align-items:center}.primary,.secondary,.danger{border:0;border-radius:9px;padding:10px 14px;font-weight:800;font-size:12px}.primary{background:var(--green);color:#fff}.secondary{background:#e7eee7;color:var(--green)}.danger{background:#fae1dc;color:#a83f35}.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:9px 11px;width:260px}.search input{border:0;outline:0;background:transparent;width:100%;font-size:12px;color:var(--ink)}.pos{display:grid;grid-template-columns:1.25fr .75fr;min-height:calc(100vh - 170px);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow)}.catalog{padding:24px}.scanner{display:flex;align-items:center;gap:7px;color:#6f8074;font-size:10px;margin-top:7px}.scanner i{width:7px;height:7px;border-radius:50%;background:#6aa85e;box-shadow:0 0 0 3px #6aa85e24}.search kbd{font-size:9px;border:1px solid var(--line);border-bottom-width:2px;padding:2px 5px;border-radius:4px;color:#8a958d;background:#f3ede4}.cats{display:flex;gap:7px;overflow:auto;margin:21px 0 14px}.cat{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:8px 12px;font-size:11px;white-space:nowrap;color:#66756b}.cat.active{background:var(--green);color:#fff;border-color:var(--green)}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.product{border:1px solid var(--line);background:var(--paper);border-radius:11px;padding:14px;text-align:left;min-height:130px;display:flex;flex-direction:column}.product:hover{border-color:#8fac95;box-shadow:var(--shadow)}.product small{color:#8a956d;font-size:9px;text-transform:uppercase;letter-spacing:.1em}.product strong{font-size:13px;margin:11px 0 6px}.product em{font-style:normal;color:#7d887f;font-size:10px}.product b{margin-top:auto;color:var(--green);font-size:13px}.cart{padding:24px;background:#f1eadf;border-left:1px solid var(--line);display:flex;flex-direction:column}.cart-head{display:flex;justify-content:space-between;align-items:start}.cart-lines{flex:1;overflow:auto;margin-top:17px}.cart-line{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;border-top:1px solid #dfd5c8;padding:13px 0}.cart-line strong,.cart-line small{display:block}.cart-line strong{font-size:11px}.cart-line small{font-size:10px;color:#818c84;margin-top:3px}.qty{display:flex;align-items:center;gap:5px}.qty button,.remove{width:23px;height:23px;border-radius:5px;border:1px solid var(--line);background:var(--paper);color:#5f6d64}.remove{border:0;background:transparent;color:#a36a61}.settle{border-top:1px solid #d9cebf;padding-top:16px}.row,.total{display:flex;justify-content:space-between;align-items:center}.row{font-size:12px;color:#758178}.total{border-top:1px solid #d9cebf;margin-top:13px;padding:16px 0 12px}.total strong{font-size:25px}.input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);outline:0;font-size:12px}.payments{display:flex;gap:6px;margin:13px 0 10px}.pay{flex:1;border:1px solid var(--line);background:var(--paper);color:#69776d;border-radius:7px;padding:9px 3px;font-size:11px;font-weight:800}.pay.active{background:var(--green);color:white;border-color:var(--green)}.empty{min-height:140px;display:grid;place-items:center;text-align:center;color:#8d9a91;font-size:12px;padding:20px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th{background:#f3ede4;color:#778279;font-size:9px;text-transform:uppercase;letter-spacing:.12em;text-align:left;padding:12px 16px}.table td{padding:13px 16px;border-top:1px solid var(--line);font-size:12px}.table td strong,.table td small{display:block}.table td small{color:#87928b;font-size:10px;margin-top:3px}.ok{color:#237052}.low{color:var(--red)}.badge.ok{background:#dfeee3;color:#246146;border:0}.badge.warn{background:#f7ebce;color:#8d6d34;border:0}.badge.low{background:#f9dfda;color:#af483d;border:0}.form{padding:17px;margin:-7px 0 20px}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}.notice{padding:15px 17px;background:#fff5e8;border:1px solid #ecd5be;border-radius:14px;color:#805b36;margin-bottom:18px;font-size:12px;line-height:1.5}.report-grid,.personal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:18px}.card{padding:21px;border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow);min-height:205px}.card.eye{background:#e7f2e5;border-color:#c9dfc5}.card.ring{background:#fbf0d7;border-color:#edd9a4}.card.rule{background:#e9ebe4;border-color:#d7dbcd}.card h3{font-size:17px;margin:8px 0}.card>b{display:block;font-size:25px;margin-top:15px}.card p:not(.eyebrow){font-size:11px;color:#66736a;line-height:1.5}.ledger{display:grid;gap:0}.ledger-row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-top:1px solid var(--line);font-size:12px}.ledger-row:first-child{border-top:0}.ledger-row small,.ledger-row strong{display:block}.ledger-row small{color:#87928b;font-size:10px;margin-top:3px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 30% 10%,#e9f1e4 0,transparent 33%),var(--cream)}.login-card{max-width:400px;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:38px;box-shadow:0 20px 70px #23372b1f}.login-card h1{font-size:34px;letter-spacing:-.05em;line-height:1.04;margin:10px 0 13px}.login-card p:not(.eyebrow){color:var(--muted);font-size:13px;line-height:1.5}.receipt-overlay{position:fixed;inset:0;z-index:99;background:#174a3b5c;display:grid;place-items:center;padding:20px}.receipt-dialog{width:min(100%,470px);max-height:92vh;overflow:auto;background:#f1eadf;border:1px solid var(--line);border-radius:15px;padding:14px}.receipt-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:#52645a;font-size:12px;font-weight:800}.receipt-actions div{display:flex;gap:7px}.receipt{width:80mm;max-width:100%;margin:auto;padding:22px 14px;background:#fff;color:#17221c;font:10px/1.4 monospace}.receipt-brand{text-align:center;margin-bottom:14px}.receipt-brand strong{display:block;font-size:17px;letter-spacing:.06em}.receipt-brand span{font-size:8px;color:#637166}.dash{border-top:1px dashed #aeb7af;margin:10px 0}.receipt-meta,.receipt-total,.receipt-item{display:flex;justify-content:space-between;gap:10px}.receipt-meta{font-size:8px;color:#647168}.receipt-item{margin:9px 0}.receipt-item strong,.receipt-item small{display:block}.receipt-item small{color:#68756c;font-size:9px}.receipt-total{margin:4px 0}.grand{font-size:13px;margin-top:9px}.receipt-payment{text-align:center;font-size:9px;margin-top:13px}.thanks{text-align:center;color:#637166;font-size:9px;margin-top:19px}

@media(max-width:780px){.app{display:block}.rail{width:100%;height:auto;min-height:0;position:static;padding:14px 16px}.brand{border:0;padding-bottom:10px}.role,.bottom{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto;padding:8px 10px;font-size:11px}.nav button span{display:none}.nav button.active span{display:inline}.top{height:78px;padding:0 18px}.top h1{font-size:18px}.top-right .pill{display:none}.content{padding:22px 16px 38px}.hero{align-items:flex-start;flex-direction:column}.stats,.grid2,.report-grid,.personal-grid{grid-template-columns:1fr}.pos{display:block}.cart{border-left:0;border-top:1px solid var(--line);min-height:430px}.toolbar{align-items:flex-start;flex-direction:column}.actions{width:100%;align-items:stretch;flex-direction:column}.search{width:100%}.products{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.reserve{align-items:flex-start;flex-direction:column}}

<body>
<div id="root"></div>
<script>
(function(){
'use strict';
const KEY='zaki_market_offline_v2';
const seed=[
{id:'1',name:'Cevital huile 1L',category:'Essentials',cost:135,price:155,stock:18,min:6,barcode:'613000000001',unit:'bottle'},
{id:'2',name:'Lait Soummam 1L',category:'Dairy',cost:110,price:125,stock:24,min:8,barcode:'613000000002',unit:'unit'},
{id:'3',name:'Coca-Cola 1.5L',category:'Drinks',cost:120,price:150,stock:16,min:6,barcode:'613000000003',unit:'bottle'},
{id:'4',name:'Hamoud Boualem 1L',category:'Drinks',cost:95,price:120,stock:22,min:6,barcode:'613000000004',unit:'bottle'},
{id:'5',name:'Bimo gaufrette',category:'Snacks',cost:35,price:50,stock:36,min:10,barcode:'613000000005',unit:'unit'},
{id:'6',name:'Pâtes 500g',category:'Essentials',cost:48,price:60,stock:28,min:8,barcode:'613000000006',unit:'pack'},
{id:'7',name:'Sucre 1kg',category:'Essentials',cost:105,price:120,stock:14,min:5,barcode:'613000000007',unit:'bag'},
{id:'8',name:'Lessive poudre 1kg',category:'Home care',cost:240,price:285,stock:9,min:3,barcode:'613000000008',unit:'pack'}
];
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{products:seed,sales:[],expenses:[],customers:[],withdrawals:[],pin:'12345'};
let state={tab:'dashboard',role:null,search:'',category:'All',cart:[],discount:0,payment:'cash',customerId:'',toast:'',lastReceipt:null,stockSearch:'',customerSearch:''};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(v){return `${Number(v||0).toLocaleString('fr-DZ')} DA`}
function date(v){return new Date(v).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function toast(message){state.toast=message;render();setTimeout(()=>{state.toast='';render()},2600)}
function isAdmin(){return state.role==='admin'}
function todaySales(){const d=new Date();return db.sales.filter(s=>new Date(s.createdAt).toDateString()===d.toDateString()&&s.status!=='cancelled')}
function summary(){const sales=todaySales();const stockValue=db.products.reduce((a,p)=>a+p.stock*p.cost,0);const credit=db.customers.reduce((a,c)=>a+c.balance,0);const low=db.products.filter(p=>p.stock<=p.min);return {sales:sales.reduce((a,s)=>a+s.total,0),profit:sales.reduce((a,s)=>a+s.profit,0),stockValue,credit,low,items:sales.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.quantity,0),0)}}
function nav(){return `<aside class="rail"><div class="brand"><div class="mark">Z</div><div><b>ZAKI'S</b><small>MARKET</small></div></div><div class="role"><span class="dot"></span>${isAdmin()?'Administrator':'Cashier'}<strong>${isAdmin()?'Zaki':'Sales operator'}</strong></div><nav class="nav"><button class="${state.tab==='dashboard'?'active':''}" onclick="Z.tab('dashboard')">▦ <span>Overview</span></button><button class="${state.tab==='pos'?'active':''}" onclick="Z.tab('pos')">▣ <span>Point of sale</span></button><button class="${state.tab==='stock'?'active':''}" onclick="Z.tab('stock')">□ <span>Stock room</span></button><button class="${state.tab==='customers'?'active':''}" onclick="Z.tab('customers')">♙ <span>Customers & credit</span></button>${isAdmin()?`<button class="${state.tab==='reports'?'active':''}" onclick="Z.tab('reports')">◫ <span>Reports</span></button><button class="${state.tab==='personal'?'active':''}" onclick="Z.tab('personal')">◈ <span>Personal plan</span></button>`:''}</nav><div class="bottom"><button onclick="Z.lock()">⇥ Lock / switch role</button></div></aside>`}
function top(){const title={dashboard:'Good morning, Zaki.',pos:'Point of sale',stock:'Stock room',customers:'Customers & credit',reports:'Reports & controls',personal:'Personal plan'}[state.tab]||'Zaki’s Market';return `<header class="top"><div><p class="eyebrow">CONTROL DESK / ${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long'})}</p><h1>${title}</h1></div><div class="top-right"><span class="pill">OFFLINE · DA / DZD</span><div class="avatar">${isAdmin()?'Z':'C'}</div></div></header>`}
function dashboard(){const s=summary();return `<main class="content"><section class="hero"><div><p class="eyebrow" style="color:#b9d0c0">TODAY'S OPERATING PICTURE</p><h2>Run the shop on evidence.</h2><p>Protect restocking money first. Personal withdrawals stay separate.</p></div><button class="light" onclick="Z.tab('pos')">Open the till →</button></section><div class="stats"><div class="stat"><p class="eyebrow">Sales today</p><b>${money(s.sales)}</b><small>${todaySales().length} receipts</small></div><div class="stat gold"><p class="eyebrow">Gross profit today</p><b>${money(s.profit)}</b><small>Before expenses</small></div><div class="stat"><p class="eyebrow">Stock at cost</p><b>${money(s.stockValue)}</b><small>${s.low.length} products at reorder level</small></div><div class="stat red"><p class="eyebrow">Customer credit</p><b>${money(s.credit)}</b><small>Outstanding balance</small></div></div><div class="grid2"><section class="panel"><div class="panel-head"><div><p class="eyebrow">WATCH LIST</p><h2>What needs attention</h2></div><button class="link" onclick="Z.tab('stock')">Open stock →</button></div><div class="watch"><div class="watch-row"><span class="watch-icon red">!</span><div><strong>Low stock</strong><small>${s.low.slice(0,3).map(p=>esc(p.name)).join(' · ')||'Everything above reorder level'}</small></div><b>${s.low.length} items</b></div><div class="watch-row"><span class="watch-icon gold">◷</span><div><strong>Expiry control</strong><small>Record expiry dates when receiving stock</small></div><b>Manual</b></div><div class="watch-row"><span class="watch-icon green">✓</span><div><strong>Offline safety</strong><small>Data is saved in this browser only</small></div><b>Local</b></div></div></section><section class="panel"><div class="panel-head"><div><p class="eyebrow">LATEST ACTIVITY</p><h2>Recent receipts</h2></div><button class="link" onclick="Z.tab('reports')">Full reports →</button></div><div class="ledger">${db.sales.slice(0,6).map(s=>`<div class="ledger-row"><div><strong>${esc(s.receiptNo)}</strong><small>${date(s.createdAt)} · ${esc(s.payment)}</small></div><b>${money(s.total)}</b></div>`).join('')||'<div class="empty">No receipts yet. Open Point of sale.</div>'}</div></section></div><section class="reserve"><div><span class="reserve-icon">✓</span><strong>Eye-care reserve: 7,500 DA every six months · keep it outside shop profit.</strong></div><button class="link" onclick="Z.tab('personal')">Open personal plan →</button></section></main>`}
function pos(){const cats=['All',...new Set(db.products.map(p=>p.category))];const f=db.products.filter(p=>(p.name.toLowerCase().includes(state.search.toLowerCase())||String(p.barcode).includes(state.search)||String(p.id)===state.search)&&(state.category==='All'||p.category===state.category));const sub=state.cart.reduce((a,i)=>a+i.price*i.quantity,0);const disc=isAdmin()?Math.min(Number(state.discount)||0,sub):0;const total=Math.max(0,sub-disc);const customer=db.customers.find(c=>c.id===state.customerId);return `<main class="content"><div class="pos"><section class="catalog"><div class="toolbar"><div><p class="eyebrow">COUNTER MODE</p><h2>Scan or choose products</h2><div class="scanner"><i></i>Scanner ready · scan barcode then press Enter</div></div><label class="search"><span>⌕</span><input id="scanInput" value="${esc(state.search)}" placeholder="Scan barcode or search" oninput="Z.search(this.value)" onkeydown="Z.scan(event)" autofocus><kbd>Enter</kbd></label></div><div class="cats">${cats.map(c=>`<button class="cat ${state.category===c?'active':''}" onclick="Z.category('${esc(c)}')">${esc(c)}</button>`).join('')}</div><div class="products">${f.map(p=>`<button class="product" onclick="Z.add('${p.id}')" ${p.stock<=0?'disabled':''}><small>${esc(p.category)}</small><strong>${esc(p.name)}</strong><em>${p.stock} ${esc(p.unit)} left · ${esc(p.barcode||p.id)}</em><b>${money(p.price)}</b></button>`).join('')||'<div class="empty">No exact product found.<br>Check the barcode in Stock room.</div>'}</div></section><aside class="cart"><div class="cart-head"><div><p class="eyebrow">CURRENT SALE</p><h2>Basket</h2></div><span class="pill">${state.cart.length} lines</span></div><div class="cart-lines">${state.cart.map(i=>`<div class="cart-line"><div><strong>${esc(i.name)}</strong><small>${money(i.price)} / ${esc(i.unit)}</small></div><div class="qty"><button onclick="Z.qty('${i.id}',-1)">−</button><b>${i.quantity}</b><button onclick="Z.qty('${i.id}',1)">+</button></div><strong>${money(i.price*i.quantity)}</strong><button class="remove" onclick="Z.qty('${i.id}',-${i.quantity})">×</button></div>`).join('')||'<div class="empty">Basket is empty.<br>Scan a barcode or tap a product.</div>'}</div>${state.cart.length?`<div class="settle"><div class="row"><span>Subtotal</span><b>${money(sub)}</b></div>${isAdmin()?`<div class="row" style="margin-top:10px"><span>Admin discount</span><input class="input" style="width:100px;text-align:right" type="number" min="0" value="${state.discount}" oninput="Z.discount(this.value)"></div>`:''}<div class="payments">${['cash','card','credit'].map(x=>`<button class="pay ${state.payment===x?'active':''}" onclick="Z.payment('${x}')">${x==='cash'?'Cash':x==='card'?'Card':'Credit'}</button>`).join('')}</div>${state.payment==='credit'?`<select class="input" onchange="Z.customer(this.value)"><option value="">Select customer account</option>${db.customers.map(c=>`<option value="${c.id}" ${state.customerId===c.id?'selected':''}>${esc(c.name)} · ${money(c.balance)} owed</option>`).join('')}</select>`:''}<div class="total"><span>Total</span><strong>${money(total)}</strong></div><button class="primary" style="width:100%" onclick="Z.checkout()">▣ Complete sale</button>${state.lastReceipt?'<button class="secondary" style="width:100%;margin-top:8px" onclick="Z.print()">▣ Print last receipt</button>':''}</div>`:''}</aside></div></main>`}
function stock(){const list=db.products.filter(p=>`${p.name} ${p.barcode} ${p.category}`.toLowerCase().includes(state.stockSearch.toLowerCase()));return `<main class="content"><div class="toolbar"><div><p class="eyebrow">INVENTORY CONTROL</p><h2>Stock room</h2><p>Protect availability, margin and expiry dates.</p></div><div class="actions"><label class="search"><span>⌕</span><input value="${esc(state.stockSearch)}" placeholder="Filter products" oninput="Z.stockSearch(this.value)"></label>${isAdmin()?'<button class="primary" onclick="Z.newProduct()">＋ Add product</button>':''}</div></div>${isAdmin()?`<div id="productForm"></div>`:''}<div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Barcode / SKU</th><th>Cost</th><th>Sale</th><th>Margin</th><th>Stock</th><th>Signal</th>${isAdmin()?'<th>Action</th>':''}</tr></thead><tbody>${list.map(p=>`<tr><td><strong>${esc(p.name)}</strong><small>${esc(p.category)} · ${esc(p.unit)}</small></td><td>${esc(p.barcode||p.id)}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td class="ok">${money(p.price-p.cost)}</td><td class="${p.stock<=p.min?'low':''}"><b>${p.stock}</b><small>min ${p.min}</small></td><td><span class="badge ${p.stock<=p.min?'low':'ok'}">${p.stock<=p.min?'Reorder':'Healthy'}</span></td>${isAdmin()?`<td><button class="secondary" onclick="Z.edit('${p.id}')">Edit</button> <button class="danger" onclick="Z.loss('${p.id}')">Loss</button></td>`:''}</tr>`).join('')||'<tr><td colspan="8" class="empty">No products. Add your opening stock.</td></tr>'}</tbody></table></div></main>`}
function customers(){const list=db.customers.filter(c=>c.name.toLowerCase().includes(state.customerSearch.toLowerCase()));return `<main class="content"><div class="toolbar"><div><p class="eyebrow">TRUST, WITH LIMITS</p><h2>Customers & credit</h2><p>Credit is a controlled service, not an informal promise.</p></div><button class="primary" onclick="Z.newCustomer()">＋ New customer</button></div><div id="customerForm"></div><div class="table-wrap"><table class="table"><thead><tr><th>Customer</th><th>Phone</th><th>Credit limit</th><th>Balance owed</th><th>Action</th></tr></thead><tbody>${list.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.phone||'—')}</td><td>${c.limit?money(c.limit):'No limit'}</td><td class="${c.balance?'low':'ok'}"><b>${money(c.balance)}</b></td><td><button class="secondary" ${!c.balance?'disabled':''} onclick="Z.repay('${c.id}')">Record repayment</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No customer accounts yet.</td></tr>'}</tbody></table></div></main>`}
function reports(){if(!isAdmin())return `<main class="content"><div class="notice"><b>Reports are administrator-only.</b><br>Cashier accounts can sell, but profit, expenses, withdrawals and audit data stay with Zaki.</div></main>`;const s=summary();return `<main class="content"><div class="toolbar"><div><p class="eyebrow">CLOSE THE DAY WITH EVIDENCE</p><h2>Reports & controls</h2><p>Keep restocking money ahead of personal withdrawals.</p></div><span class="badge ok">Admin only</span></div><div class="stats"><div class="stat"><p class="eyebrow">Sales today</p><b>${money(s.sales)}</b><small>${todaySales().length} receipts</small></div><div class="stat gold"><p class="eyebrow">Gross profit today</p><b>${money(s.profit)}</b><small>Before expenses</small></div><div class="stat red"><p class="eyebrow">Expenses total</p><b>${money(db.expenses.reduce((a,e)=>a+e.amount,0))}</b><small>Offline ledger</small></div><div class="stat"><p class="eyebrow">Personal reserves</p><b>${money(db.withdrawals.reduce((a,w)=>a+w.amount,0))}</b><small>Separate from profit</small></div></div><div class="grid2"><section class="panel"><div class="panel-head"><div><p class="eyebrow">QUICK ENTRY</p><h2>Record expense</h2></div></div><form onsubmit="Z.expense(event)" style="display:grid;gap:9px;margin-top:20px"><input class="input" name="category" placeholder="Category e.g. electricity" required><input class="input" name="description" placeholder="Description" required><input class="input" name="amount" type="number" placeholder="Amount DA" required><button class="primary">Record expense</button></form></section><section class="panel"><div class="panel-head"><div><p class="eyebrow">RECENT EXPENSES</p><h2>Expense ledger</h2></div></div><div class="ledger">${db.expenses.slice(0,7).map(e=>`<div class="ledger-row"><div><strong>${esc(e.description)}</strong><small>${esc(e.category)} · ${date(e.createdAt)}</small></div><b>${money(e.amount)}</b></div>`).join('')||'<div class="empty">No expenses recorded.</div>'}</div></section></div></main>`}
function personal(){if(!isAdmin())return '';const eye=db.withdrawals.filter(w=>w.purpose==='eye').reduce((a,w)=>a+w.amount,0);return `<main class="content"><div class="toolbar"><div><p class="eyebrow">SEPARATE FROM SHOP PROFIT</p><h2>Personal plan</h2><p>Record reserves only after the shop can restock and cover obligations.</p></div><span class="pill">Offline private ledger</span></div><div class="personal-grid"><section class="card eye"><p class="eyebrow">HEALTH FIRST</p><h3>Eye-care reserve</h3><b>${money(Math.min(eye,7500))}</b><p>Target: 7,500 DA every six months. At 1,200 DA/day, the target takes 7 days.</p><button class="secondary" onclick="Z.withdraw('eye',1200,'Eye-care reserve')">Record 1,200 DA</button></section><section class="card ring"><p class="eyebrow">MAY / JUNE 2027</p><h3>Engagement ring</h3><b>100,000–115,000 DA</b><p>Plan around 100,000 DA with a gold-price buffer. Never take it from restocking cash.</p><button class="secondary" onclick="Z.withdraw('ring',19167,'Monthly ring reserve')">Record June reserve</button></section><section class="card rule"><p class="eyebrow">COUNSEL</p><h3>Business rule</h3><b>Restock before rewards.</b><p>Your father funds the shop, equipment and opening stock. Your responsibility is disciplined operation and transparent records.</p></section></div><section class="panel"><div class="panel-head"><div><p class="eyebrow">RESERVE LEDGER</p><h2>Recorded personal withdrawals</h2></div></div><div class="ledger">${db.withdrawals.map(w=>`<div class="ledger-row"><div><strong>${esc(w.purpose)}</strong><small>${esc(w.note)} · ${date(w.createdAt)}</small></div><b>${money(w.amount)}</b></div>`).join('')||'<div class="empty">No personal reserves recorded.</div>'}</div></section></main>`}
function app(){if(!state.role)return login();return `<div class="app">${nav()}<div class="main">${top()}${state.tab==='dashboard'?dashboard():state.tab==='pos'?pos():state.tab==='stock'?stock():state.tab==='customers'?customers():state.tab==='reports'?reports():personal()}</div></div>${state.toast?`<div style="position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:120;background:#174a3b;color:#fff;padding:11px 17px;border-radius:10px;font-size:12px;font-weight:800;box-shadow:var(--shadow)">${esc(state.toast)}</div>`:''}${state.lastReceipt?receiptModal():''}`}
function login(){return `<main class="login"><section class="login-card"><div class="mark">Z</div><p class="eyebrow" style="margin-top:18px">ZAKI'S MARKET · OFFLINE</p><h1>Keep the shop under control.</h1><p>This file works without internet. Your data is saved only in this browser on this device.</p><div style="display:grid;gap:9px;margin-top:20px"><button class="primary" onclick="Z.login('admin')">Enter as Administrator</button><button class="secondary" onclick="Z.login('cashier')">Enter as Cashier</button></div><p style="font-size:10px;margin-top:18px">Default administrator PIN: 12345. Change it after first login. Offline role protection is operational, not a substitute for a secured multi-user server.</p></section></main>`}
function receiptModal(){const r=state.lastReceipt;return `<div class="receipt-overlay"><div class="receipt-dialog"><div class="receipt-actions"><span>Receipt ready</span><div><button class="secondary" onclick="Z.closeReceipt()">Close</button><button class="primary" onclick="Z.print()">▣ Print receipt</button></div></div><article class="receipt"><div class="receipt-brand"><strong>ZAKI'S MARKET</strong><span>ALIMENTATION · DZD / DA</span></div><div class="dash"></div><div class="receipt-meta"><span>${esc(r.receiptNo)}</span><span>${date(r.createdAt)}</span></div><div class="dash"></div>${r.items.map(i=>`<div class="receipt-item"><div><strong>${esc(i.name)}</strong><small>${i.quantity} × ${money(i.price)}</small></div><b>${money(i.price*i.quantity)}</b></div>`).join('')}<div class="dash"></div><div class="receipt-total"><span>Subtotal</span><b>${money(r.subtotal)}</b></div>${r.discount?`<div class="receipt-total"><span>Discount</span><b>-${money(r.discount)}</b></div>`:''}<div class="receipt-total grand"><span>TOTAL</span><b>${money(r.total)}</b></div><div class="receipt-payment">Payment: <strong>${esc(r.payment.toUpperCase())}</strong></div><p class="thanks">Thank you · Merci</p></article></div></div>`}
function render(){document.getElementById('root').innerHTML=app();}
window.Z={
login(role){if(role==='admin'){const pin=prompt('Administrator PIN','12345');if(pin!==db.pin)return toast('Incorrect administrator PIN')}state.role=role;state.tab=role==='admin'?'dashboard':'pos';render()},lock(){state.role=null;state.cart=[];state.lastReceipt=null;render()},tab(t){state.tab=t;render()},search(v){state.search=v;render();focusScan()},category(v){state.category=v;render()},stockSearch(v){state.stockSearch=v;render()},customerSearch(v){state.customerSearch=v;render()},discount(v){state.discount=v;render()},payment(v){state.payment=v;render()},customer(v){state.customerId=v;render()},add(id){const p=db.products.find(x=>x.id===id);if(!p||p.stock<=0)return toast('Product is out of stock');const f=state.cart.find(x=>x.id===id);if(f){if(f.quantity>=p.stock)return toast('No more stock available');f.quantity++}else state.cart.push({...p,quantity:1});state.search='';render();focusScan()},qty(id,d){const i=state.cart.find(x=>x.id===id);if(!i)return;i.quantity+=d;if(i.quantity<=0)state.cart=state.cart.filter(x=>x.id!==id);render()},scan(e){if(e.key!=='Enter')return;e.preventDefault();const term=state.search.trim().toLowerCase();if(!term)return;const exact=db.products.find(p=>String(p.barcode).toLowerCase()===term||String(p.id).toLowerCase()===term);if(exact)return this.add(exact.id);const matches=db.products.filter(p=>p.name.toLowerCase().includes(term));if(matches.length===1)return this.add(matches[0].id);toast('No exact barcode or SKU match')},checkout(){if(!state.cart.length)return;const sub=state.cart.reduce((a,i)=>a+i.price*i.quantity,0);const disc=isAdmin()?Math.min(Number(state.discount)||0,sub):0;const total=Math.max(0,sub-disc);if(state.payment==='credit'&&!state.customerId)return toast('Select a customer for credit sales');const c=db.customers.find(x=>x.id===state.customerId);if(state.payment==='credit'&&c&&c.limit&&c.balance+total>c.limit)return toast('Customer credit limit exceeded');const receiptNo='ZM-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+String(Date.now()).slice(-5);const items=state.cart.map(i=>({...i}));items.forEach(i=>{const p=db.products.find(x=>x.id===i.id);if(p)p.stock-=i.quantity});if(c&&state.payment==='credit')c.balance+=total;const profit=items.reduce((a,i)=>a+(i.price-i.cost)*i.quantity,0)-disc;db.sales.unshift({receiptNo,createdAt:new Date().toISOString(),items,total,subtotal:sub,discount:disc,payment:state.payment,profit,status:'completed'});save();state.lastReceipt={receiptNo,createdAt:new Date().toISOString(),items,total,subtotal:sub,discount:disc,payment:state.payment};state.cart=[];state.search='';state.discount=0;state.payment='cash';state.customerId='';render()},print(){window.print()},closeReceipt(){state.lastReceipt=null;render()},newProduct(){document.getElementById('productForm').innerHTML=`<form class="form" onsubmit="Z.saveProduct(event)"><div class="form-grid"><input class="input" name="name" placeholder="Product name" required><input class="input" name="category" placeholder="Category" value="Essentials" required><input class="input" name="barcode" placeholder="Barcode / SKU" required><input class="input" name="unit" placeholder="Unit" value="unit"><input class="input" name="cost" type="number" placeholder="Cost DA" required><input class="input" name="price" type="number" placeholder="Sale DA" required><input class="input" name="stock" type="number" placeholder="Opening stock" required><input class="input" name="min" type="number" placeholder="Reorder level" value="5"></div><button class="primary">Save product</button> <button type="button" class="secondary" onclick="Z.tab('stock')">Cancel</button></form>`},saveProduct(e){e.preventDefault();const f=new FormData(e.target);db.products.push({id:String(Date.now()),name:String(f.get('name')),category:String(f.get('category')),barcode:String(f.get('barcode')),unit:String(f.get('unit')||'unit'),cost:Number(f.get('cost')),price:Number(f.get('price')),stock:Number(f.get('stock')),min:Number(f.get('min')||5)});save();toast('Product added');state.tab='stock';render()},edit(id){const p=db.products.find(x=>x.id===id);if(!p)return;const price=prompt('Sale price DA',p.price);const stock=prompt('Current stock',p.stock);const barcode=prompt('Barcode / SKU',p.barcode||'');if(price===null||stock===null||barcode===null)return;p.price=Number(price);p.stock=Number(stock);p.barcode=barcode;save();toast('Product updated');render()},loss(id){const p=db.products.find(x=>x.id===id);if(!p)return;const q=Number(prompt('Loss quantity', '1'));const reason=prompt('Reason','Damaged / expired');if(!q||q>p.stock||!reason)return;p.stock-=q;save();toast('Loss recorded; investigate the reason');render()},newCustomer(){document.getElementById('customerForm').innerHTML=`<form class="form" onsubmit="Z.saveCustomer(event)"><div class="form-grid"><input class="input" name="name" placeholder="Customer name" required><input class="input" name="phone" placeholder="Phone"><input class="input" name="limit" type="number" placeholder="Credit limit DA"><span></span></div><button class="primary">Create account</button> <button type="button" class="secondary" onclick="Z.tab('customers')">Cancel</button></form>`},saveCustomer(e){e.preventDefault();const f=new FormData(e.target);db.customers.push({id:String(Date.now()),name:String(f.get('name')),phone:String(f.get('phone')||''),limit:Number(f.get('limit')||0),balance:0});save();toast('Customer account created');render()},repay(id){const c=db.customers.find(x=>x.id===id);if(!c)return;const q=Number(prompt('Repayment amount DA',c.balance));if(!q||q<=0)return;c.balance=Math.max(0,c.balance-q);save();toast('Repayment recorded');render()},expense(e){e.preventDefault();const f=new FormData(e.target);db.expenses.unshift({category:String(f.get('category')),description:String(f.get('description')),amount:Number(f.get('amount')),createdAt:new Date().toISOString()});save();toast('Expense recorded');render()},withdraw(purpose,amount,note){const q=Number(prompt('Amount DA',amount));if(!q||q<=0)return;db.withdrawals.unshift({purpose,amount:q,note,createdAt:new Date().toISOString()});save();toast('Personal reserve recorded');render()}}
function focusScan(){setTimeout(()=>document.getElementById('scanInput')?.focus(),0)}
render();
})();
</script>
