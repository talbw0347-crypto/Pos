name: Build Zaki's Market POS (Windows EXE)

on:
  push:
    branches: [main, master]
    paths:
      - 'electron/**'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron/package.json

      - name: Install dependencies
        working-directory: electron
        run: npm install

      - name: Build Windows EXE (NSIS installer + portable)
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist

      - name: Upload artifacts to Actions tab
        uses: actions/upload-artifact@v4
        with:
          name: ZakiMarket-POS-windows
          path: electron/release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach EXE to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: electron/release/*.exe
          generate_release_notes: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
